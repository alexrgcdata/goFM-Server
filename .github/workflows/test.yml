name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/api ./cmd/gofm-server
      - run: go build -trimpath -o bin/gofm-server ./cmd/gofm-server
      - run: GOOS=windows GOARCH=amd64 go build -trimpath -o bin/gofm-server.exe ./cmd/gofm-server
